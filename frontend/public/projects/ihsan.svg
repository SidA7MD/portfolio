    <linearGradient id="iHero" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4f7fd4" stop-opacity="0.3"/><stop offset="100%" stop-color="#47a248" stop-opacity="0.15"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#iBg)"/>
